{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Capas</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
</head>
<body>
    <h1>Visualizador de Datos Geoespaciales</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Sube uno o más archivos (.shp, .csv o .geojson):</label><br>
        <input type="file" id="layer_files" name="layer_files" multiple accept=".shp,.csv,.geojson"><br><br>

        <div id="color-selectors"></div>

        <label>O selecciona una variable de la base de datos:</label><br>
        <select name="db_variable">
            <option value="">-- Seleccionar variable --</option>
            <option value="velocidad del viento">Velocidad del viento</option>
            <option value="direccion del viento">Dirección del viento</option>
            <option value="nivel del mar">Nivel del mar</option>
            <option value="precipitacion acumulada">Precipitación acumulada</option>
            <option value="temperatura del mar">Temperatura del mar</option>
        </select><br><br>

        <label for="db_color">Color para variable BD (opcional):</label>
        <select name="db_color" id="db_color">
            <option value="Turbo">Turbo</option>
            <option value="Viridis">Viridis</option>
            <option value="Cividis">Cividis</option>
            <option value="Plasma">Plasma</option>
            <option value="Magma">Magma</option>
            <option value="Hot">Hot</option>
            <option value="Jet">Jet</option>
            <option value="YlOrRd">YlOrRd</option>
        </select><br><br>

        <label for="render_type">Tipo de visualización:</label>
        <select name="render_type" id="render_type">
            <option value="heatmap">Mapa de calor</option>
            <option value="points">Puntos individuales</option>
        </select><br><br>

        <button type="submit">Visualizar</button>
    </form>

    <hr>

    {% if plot_div %}
        <div id="layer-controls"></div>
        {{ plot_div|safe }}
    {% endif %}

<script>
document.addEventListener('DOMContentLoaded', function () {
    const COLORSCALES = ['Turbo','Viridis','Cividis','Plasma','Magma','Hot','Jet','YlOrRd'];

    const layerFilesEl = document.getElementById('layer_files');
    if (!layerFilesEl) return;

    layerFilesEl.addEventListener('change', updateColorSelectors);

    function updateColorSelectors() {
        const files = layerFilesEl.files;
        const container = document.getElementById('color-selectors');
        container.innerHTML = '';
        for (let i = 0; i < files.length; i++) {
            const file = files[i];

            const wrapper = document.createElement('div');
            wrapper.style.marginBottom = '8px';

            const label = document.createElement('label');
            label.textContent = `Color para "${file.name}": `;
            label.htmlFor = `color_select_${i}`;

            const select = document.createElement('select');
            select.name = 'colors';  // backend leerá request.POST.getlist('colors')
            select.id = `color_select_${i}`;

            for (const c of COLORSCALES) {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            }

            wrapper.appendChild(label);
            wrapper.appendChild(select);
            container.appendChild(wrapper);
        }
    }
});
</script>
</body>
</html>
